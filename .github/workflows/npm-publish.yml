# Publish to npm on push to main — using the version already in package.json.
#
# Versioning is MANUAL: a maintainer bumps `version` in package.json and commits it.
# CI never bumps the version and never commits anything back. On each push it builds,
# tests, and — only if package.json's version is not yet on npm — publishes. Pushes that
# don't change the version simply build+test and skip the publish (staying green), so the
# published package always matches the committed version.
name: Publish to npm

on:
  push:
    branches: [main]

# Never run two publishes at once.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build dist/crack.js
        run: npm run build     # regenerates the bundled dist from src

      - name: Test
        run: |
          node test.js             # round-trips every hash type against its hashcat vector
          node test-attack.js      # attack/keyspace invariants: coverage exactly-once, BigInt exactness
          node test-wordlist-fs.js # streaming byte-shard wordlist coverage (huge-file distribution)

      - name: Is this version already published?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm — skipping publish. Bump the version in package.json to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is new — publishing."
          fi

      - name: Verify npm authentication
        # Fails early and clearly if NPM_TOKEN is missing/expired/read-only.
        # (A bad token makes `npm publish` return a confusing "404 Not Found - PUT".)
        if: steps.check.outputs.publish == 'true'
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
